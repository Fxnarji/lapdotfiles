source = ~/.config/hypr/hyprlock-accent.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    color = rgb(111111)
}

label {
    monitor =
    text = $TIME
    color = rgb(efefef)
    font_size = 72
    font_family = Geist SemiBold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(6b6b6b)
    font_size = 14
    font_family = Geist
    position = 0, 50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    rounding = 22
    outer_color = $accent
    inner_color = rgb(171717)
    font_color = rgb(efefef)
    check_color = $accent
    fail_color = rgb(efefef)
    fade_on_empty = false
    placeholder_text = <span foreground="##6b6b6b">password</span>
    fail_text = wrong password
    dots_size = 0.2
    dots_spacing = 0.4
    position = 0, -40
    halign = center
    valign = center
}
