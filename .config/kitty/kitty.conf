font_family      GeistMono Nerd Font
font_size        11.0

window_padding_width 16
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam

# Mono palette from the handoff. Red (color1/9) is the wallpaper accent, set in accent.conf.
foreground            #efefef
background            #171717
background_opacity    0.8
selection_foreground  #efefef
selection_background  #3a3a3a

color0  #262626
color8  #5c5c5c
color2  #bdbdbd
color10 #efefef
color3  #efefef
color11 #ffffff
color4  #8a8a8a
color12 #bdbdbd
color5  #bdbdbd
color13 #efefef
color6  #8a8a8a
color14 #bdbdbd
color7  #bdbdbd
color15 #efefef

include accent.conf

# Interactive shell (bash stays the login shell)
shell fish
